name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Cross-Platform Installers
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libopenjp2-7 libsecret-1-dev

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies & build
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Copy frontend build to root dist
        run: |
          node -e "const fs=require('fs'); fs.mkdirSync('dist', {recursive: true}); fs.cpSync('frontend/dist', 'dist', {recursive: true});"

      - name: Compile Electron TypeScript
        run: npm run build:electron

      - name: Build and Publish Installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always --config.asarUnpack="node_modules/better-sqlite3/**"
