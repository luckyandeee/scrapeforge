name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Cross-Platform Installers
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & build React app
        run: |
          npm install
          cd frontend && npm run build
          cd ..
          node -e "const fs=require('fs'); fs.cpSync('frontend/dist', 'dist', {recursive: true});"
          npm run build:electron

      - name: Build with electron-builder
        uses:畅/electron-builder-action@v6 # Or standard electron-builder execution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --publish always
